# Dependabot keeps the SHA-pinned GitHub Actions current.
# Actions are pinned to full commit SHAs in the workflows; this bot proposes
# the pin bumps as PRs so the pins never rot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns:
          - "*"
