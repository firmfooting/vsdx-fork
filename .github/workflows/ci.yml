name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test py${{ matrix.python-version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.5"
      - name: Install
        run: uv sync --locked --no-default-groups --group test
      - name: Test
        run: uv run --no-sync python -m pytest tests -q

  minimum-dependencies:
    name: lowest direct dependencies py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.5"
      - name: Resolve declared dependency floors
        run: uv lock --upgrade --resolution lowest-direct
      - name: Install test environment
        run: uv sync --frozen --no-default-groups --group test
      - name: Show resolved versions
        run: uv pip list --python .venv
      - name: Test
        run: uv run --no-sync python -m pytest tests -q

  lint:
    name: ruff + pyrefly
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.5"
      - name: Install lint and documentation tools
        run: uv sync --locked --no-default-groups --group lint --group docs
      - name: ruff check
        run: uv run --no-sync ruff check vsdx tests
      - name: ruff format
        run: uv run --no-sync ruff format --check vsdx tests
      - name: pyrefly strict
        run: uv run --no-sync pyrefly check vsdx --min-severity warn --output-format min-text
      - name: Sphinx documentation
        run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

  build:
    name: build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.5"
      - name: Build
        run: |
          uv sync --locked --no-default-groups --group build
          uv run --no-sync python -m build
      - name: Smoke test distribution
        run: |
          uv venv dist-check
          uv pip install --python dist-check/bin/python dist/*.whl
          dist-check/bin/python -c "import vsdx; print(f'vsdxkit {vsdx.__version__} imports cleanly')"
          uv pip show --python dist-check/bin/python vsdxkit >/dev/null
          dist-check/bin/python -c "import os, vsdx; assert os.path.exists(os.path.join(os.path.dirname(vsdx.__file__), 'py.typed')), 'py.typed missing from wheel'"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
