# The PyPI Trusted Publisher for `vsdxkit` is registered against this exact
# filename and the `pypi` environment. Renaming this file breaks publishing:
# PyPI matches the OIDC claim on the workflow path, and a mismatch surfaces as
# an opaque permissions error rather than a naming one.
name: Publish

on:
  push:
    tags: ['v*']
  # Manual runs go to TestPyPI only. Real PyPI publishing happens from a tag
  # and nowhere else, so the tag/changelog checks below can never be skipped on
  # the path that produces an uncorrectable release.
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.7"
      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_REF: ${{ github.ref }}
        run: uv run --no-project python tools/check_version_tag.py "$RELEASE_REF"
      - name: Verify the changelog documents this version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version="${RELEASE_REF#refs/tags/v}"
          uv run --no-project python tools/release_check.py "$version"
      # The CI workflow starts in parallel with this one on a tag push, so its
      # result is not available here. Publishing is irreversible -- PyPI accepts
      # a version exactly once -- so the gates run again inside this job rather
      # than relying on a tag only ever being pushed at a green commit.
      - name: Install
        run: uv sync --locked --no-default-groups --group test --group lint
      - name: Test
        run: uv run --no-sync python -m pytest tests -q
      - name: Lint and type check
        run: |
          uv run --no-sync ruff check vsdx tests tools
          uv run --no-sync ruff format --check vsdx tests tools
          uv run --no-sync pyrefly check vsdx --min-severity warn --output-format min-text
      - name: Build
        run: uv build
      - name: Smoke test the wheel
        run: |
          uv venv dist-check
          uv pip install --python dist-check/bin/python dist/*.whl
          # run from outside the checkout so the source tree cannot shadow the wheel
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist-check/bin/python" "$GITHUB_WORKSPACE/tools/smoke_wheel.py" "$GITHUB_WORKSPACE"/dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to ${{ github.event_name == 'workflow_dispatch' && 'TestPyPI' || 'PyPI' }}
    needs: build
    runs-on: ubuntu-latest
    # The environment gates the OIDC claim; it is the name registered with the
    # Trusted Publisher, so it must not be templated into something else.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write   # the only job that mints an OIDC token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
          print-hash: true
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || '' }}

  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creating the release and attaching the artefacts
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.7"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          tag="${RELEASE_REF#refs/tags/}"
          version="${tag#v}"
          uv run --no-project python tools/release_check.py "$version" --print > release-notes.md
          prerelease=""
          case "$version" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            --verify-tag \
            $prerelease \
            dist/*
