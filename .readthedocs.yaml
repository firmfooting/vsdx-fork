# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need.
# Python 3.12 is the floor for the pinned Sphinx; keep it in step with
# [tool.uv.dependency-groups] docs in pyproject.toml.
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
    # Sphinx is pinned in the PEP 735 "docs" dependency group rather than in a
    # published extra, so it is installed with pip's --group flag (pip 25.1+).
    - python -m pip install --upgrade "pip>=25.1"
    - python -m pip install --group docs

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# We recommend specifying your dependencies to enable reproducible builds:
# https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
  - method: pip
    path: .
